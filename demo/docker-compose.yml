services:
  faultgen:
    build: ./faultgen
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-admin-api
      # Must match noisefloor's query step. Prometheus' default 5m staleness
      # lookback synthesises a value for up to 5m after the last real sample,
      # which masks every gap shorter than that and inflates every episode's
      # tail. Live rule-evaluated series carry staleness markers so this never
      # bites them, but blocks built by promtool from OpenMetrics carry none --
      # so without this the seeded history shows continuous firing where the
      # waveform says on/off, and the demo proves nothing.
      - --query.lookback-delta=1m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    depends_on: [faultgen]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    # Lets alertmanager.yml's commented-out webhook_configs example reach a
    # `noisefloor collect` started on the host, via host.docker.internal --
    # see the README's Demo section. host-gateway needs Docker 20.10+;
    # harmless when the commented-out entry stays commented out.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  promdata:
