# Each rule below is deliberately good or deliberately bad. The comment on
# each states the verdict noisefloor is expected to reach, and the
# integration test asserts it.
groups:
  - name: demo
    interval: 15s
    rules:
      # Fires for 3m or 4m every 97m (94m+ off) and resolves itself. Nobody
      # acts on it. Expected verdict: retire -- on a plain scan with no
      # silences this clears the threshold on short_lived_rate alone (with
      # no margin to spare: see demo/seed/main.go's DemoSpiky comment), and
      # internal/e2e/scan_test.go's injected historical silence pushes it
      # further over via silenced_rate too.
      - alert: DemoSpiky
        expr: demo_spiky_gauge > 0
        labels: {severity: warning}
        annotations: {summary: "Spiky signal breached"}

      # 3m or 4m on 90% of the time, 15m-17m on the other 10%; off long
      # enough either way for the episode to resolve before the next one.
      # Expected verdict: tune.
      - alert: DemoFlapping
        expr: demo_flapping_gauge > 0
        for: 30s
        labels: {severity: warning}
        annotations: {summary: "Flapping signal breached"}

      # Fires for 30m every 90m and stays firing. Expected verdict: automate.
      - alert: DemoSustained
        expr: demo_sustained_gauge > 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Sustained signal breached"}

      # A through D always fire together: cause-based alerting.
      # Four rules, not three: co-fire detection requires three OTHER rules
      # firing alongside, so three rules would leave each one short.
      # Off-period (68m) exceeds the 1h flap window, so flap_rate reads 0 and
      # cofire_ratio alone drives the verdict. Expected: retire on all four.
      - alert: DemoCauseA
        expr: demo_cause_gauge{component="a"} > 0
        labels: {severity: warning}
      - alert: DemoCauseB
        expr: demo_cause_gauge{component="b"} > 0
        labels: {severity: warning}
      - alert: DemoCauseC
        expr: demo_cause_gauge{component="c"} > 0
        labels: {severity: warning}
      - alert: DemoCauseD
        expr: demo_cause_gauge{component="d"} > 0
        labels: {severity: warning}

      # Never fires. Expected: present in rules, absent from scores.
      - alert: DemoQuiet
        expr: demo_quiet_gauge > 1
        labels: {severity: warning}
